version: '3.8'

services:
  # 1. Gateway WhatsApp (Evolution API v2)
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=viravoto_super_secreta_123
      - DATABASE_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

  # 2. Agente de Reenquadramento Cognitivo (FastAPI)
  reenquadra-bot:
    build: .
    container_name: reenquadra_bot
    restart: always
    ports:
      - "8000:8000"
    environment:
      - EVOLUTION_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=viravoto_super_secreta_123
      - EVOLUTION_INSTANCE=viravoto
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - evolution-api

volumes:
  evolution_instances:
